<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>みのるパン レジれんしゅう</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout concept: the bakery menu sheet itself. White photo cells with a hanging price tag and a blue name label,
   bunting along the top, and a blue cash register with a green dot-matrix display. One column on phones, two on tablets. */
:root{
  --bg:#FFF6C9; --ink:#22304A; --ink-soft:#56627C; --paper:#FFFFFF; --paper-2:#FFFBE2; --line:#E6D88E;
  --label:#74AEE3; --label-ink:#0F2440; --pop:#F7C21B; --pop-ink:#8A4210;
  --accent:#D8431F; --good:#23895A; --bad:#C62F3D; --focus:#1B64C8;
  --lcd:#CFE7C3; --lcd-ink:#1D3B2A; --reg:#4F86C6; --reg-d:#386AA3;
  --memo:#FFE680; --memo-ink:#4A3A00;
  --photo:#FFFFFF; --tag-ink:#1C2330;
  --coin-cu:#C97B45; --coin-cu-d:#8E4C22; --coin-ag:#DDE1E5; --coin-ag-d:#8F979F; --coin-au:#EBC95E; --coin-au-d:#A98219;
  --bill:#B7CFEA; --bill-d:#6F93BF; --bill-ink:#1B3556;
  --f1:#F26B3A; --f2:#58C1B3; --f3:#1F2533; --f4:#FAD66B; --f5:#7FB5E8;
  --shadow:0 2px 0 rgba(70,50,0,.12),0 6px 14px rgba(70,50,0,.10);
  --disp:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --dot:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#131B2E;--ink:#EEF2FA;--ink-soft:#AAB5CE;--paper:#1E2943;--paper-2:#18223A;--line:#38466F;--label:#3D6FA9;--label-ink:#FFFFFF;--accent:#E85A30;--good:#4CC38A;--bad:#FF7F8A;--focus:#9CC4FF;--lcd:#16301F;--lcd-ink:#9AF0B3;--reg:#2F5A91;--reg-d:#234670;--memo:#5B4B14;--memo-ink:#FFF1BE;--bill:#4F6F9C;--bill-d:#2F4A73;--bill-ink:#EAF2FF;--shadow:0 2px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.28); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#131B2E;--ink:#EEF2FA;--ink-soft:#AAB5CE;--paper:#1E2943;--paper-2:#18223A;--line:#38466F;--label:#3D6FA9;--label-ink:#FFFFFF;--accent:#E85A30;--good:#4CC38A;--bad:#FF7F8A;--focus:#9CC4FF;--lcd:#16301F;--lcd-ink:#9AF0B3;--reg:#2F5A91;--reg-d:#234670;--memo:#5B4B14;--memo-ink:#FFF1BE;--bill:#4F6F9C;--bill-d:#2F4A73;--bill-ink:#EAF2FF;--shadow:0 2px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.28); color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
#root{max-width:1040px;margin:0 auto}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
ruby rt{font-size:.5em;font-weight:700}
small{font-size:.8em}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
.crumb{flex:1;min-width:0;font-weight:900;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{flex:1;font-family:var(--disp);color:var(--pop-ink)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:14px;border:3px solid var(--line);background:var(--paper);font-weight:900}
.iconbtn.sq{width:44px;padding:0;justify-content:center}
.iconbtn svg,.pill svg{width:22px;height:22px;fill:currentColor;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--pop);color:#3B2105;font-weight:900;font-size:1.05rem}
.pill svg{fill:#3B2105}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:18px;border:0;font-weight:900;font-size:1.1rem;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line),0 0 0 3px var(--line) inset}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.btn:active:not(:disabled){translate:0 3px;box-shadow:0 2px 0 rgba(0,0,0,.25)}

/* bunting + logo */
.bunting{display:flex;justify-content:space-between;align-items:flex-start;position:relative;height:46px;margin-bottom:6px}
.bunting::before{content:"";position:absolute;left:-4px;right:-4px;top:3px;height:2px;background:var(--ink-soft);opacity:.55;border-radius:2px}
.bunting i{display:block;width:32px;height:38px;margin-top:4px;clip-path:polygon(0 0,100% 0,50% 100%);background-color:var(--c)}
.bunting i.dots{background-image:radial-gradient(rgba(255,255,255,.6) 2.4px,transparent 3px);background-size:9px 9px}
.bunting .f1{--c:var(--f1)}.bunting .f2{--c:var(--f2)}.bunting .f3{--c:var(--f3)}.bunting .f4{--c:var(--f4)}.bunting .f5{--c:var(--f5)}
.logo{font-family:var(--disp);font-weight:400;color:var(--pop);-webkit-text-stroke:8px var(--pop-ink);paint-order:stroke fill;
  text-align:center;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.18;letter-spacing:.02em;text-wrap:balance}
.logo.sm{font-size:clamp(1.8rem,7vw,2.6rem);-webkit-text-stroke-width:6px}
.lead{text-align:center;font-weight:700;margin-top:10px}
.sec{font-family:var(--disp);font-weight:400;font-size:1.15rem;margin-bottom:10px;color:var(--ink)}

/* home */
.home{display:grid;gap:22px;padding-bottom:16px}
.levels{display:grid;gap:10px}
.lvrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{display:grid;gap:0;padding:10px 6px;border-radius:16px;border:3px solid var(--line);background:var(--paper);text-align:center;line-height:1.3}
.lv small{font-weight:700;color:var(--ink-soft)}
.lv b{font-size:1.05rem}
.lv[aria-checked="true"]{background:var(--label);border-color:var(--ink);color:var(--label-ink)}
.lv[aria-checked="true"] small{color:var(--label-ink)}
.ldesc{background:var(--paper-2);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;padding:0;border:0;border-radius:20px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);text-align:center;transition:translate .12s}
.mode:hover{translate:0 -3px}
.mode .vis{display:flex;align-items:center;justify-content:center;gap:4px;min-height:120px;background:var(--photo);padding:12px}
.mode .vis img{width:104px;height:78px;object-fit:contain}
.mode .mt{display:block;background:var(--label);color:var(--label-ink);font-weight:900;font-size:1.25rem;padding:10px}
.mode .md{display:block;padding:12px 14px 16px;font-weight:700;color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--ink-soft);font-size:.85rem;font-weight:700}
.foot p{flex:1 1 320px;min-width:0}
.foot button{min-height:40px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}

/* menu cards (same look as the printed menu) */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--photo);box-shadow:var(--shadow);text-align:center;transition:translate .1s}
.card:active{translate:0 2px}
.card.on{box-shadow:0 0 0 4px var(--accent),var(--shadow)}
.tag{position:relative;align-self:center;margin-top:10px;padding:0 14px;min-width:84px;border:2px solid var(--tag-ink);border-radius:8px;background:#fff;color:var(--tag-ink);font-family:var(--dot);font-size:1.2rem;line-height:1.35}
.tag::before,.tag::after{content:"";position:absolute;top:-8px;width:2px;height:8px;background:var(--tag-ink)}
.tag::before{left:10px}.tag::after{right:10px}
.ph{display:block;padding:6px 6px 4px;background:var(--photo)}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}
.nm{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.4em;padding:6px 6px;background:var(--label);color:var(--label-ink);font-weight:900;font-size:.95rem;line-height:1.25}
.nm small{font-weight:700;font-size:.75rem}
.badge{position:absolute;top:6px;right:6px;min-width:32px;height:32px;padding:0 6px;border-radius:16px;background:var(--accent);color:#fff;border:2px solid #fff;font-weight:900;display:grid;place-items:center}
.badge[hidden]{display:none}

/* pick screens */
.pick{display:grid;gap:18px}
.pickhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
.pickhead.one{grid-template-columns:minmax(0,1fr)}
.has-dock{padding-bottom:120px}
.memo{background:var(--memo);color:var(--memo-ink);padding:14px 16px 16px;border-radius:6px 6px 14px 14px;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(0,0,0,.09) 33px 34px)}
.memo h2{font-family:var(--disp);font-weight:400;font-size:1.15rem;margin-bottom:6px}
.memo li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:34px;padding-block:3px}
.memo .x{font-weight:900;font-size:1.3rem}
.memo img,.bubble img,.line img,.rl img{width:48px;height:36px;object-fit:contain;background:#fff;border-radius:8px}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 16px}
.bubble::after{content:"";position:absolute;left:30px;bottom:-16px;width:22px;height:22px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);rotate:45deg;translate:0 -3px}
.bubble h2{font-family:var(--disp);font-weight:400;font-size:1.05rem;margin-bottom:6px}
.say{font-weight:900;font-size:1.15rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:12px;background:var(--paper-2);font-weight:900}
.tray-panel{background:var(--paper);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.empty{color:var(--ink-soft);font-weight:700;padding:10px 4px}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px;border-radius:14px;background:var(--paper-2)}
.ln{display:grid;min-width:0;line-height:1.25}
.ln b{font-weight:900}
.ln small{color:var(--ink-soft);font-weight:700}
.q{display:flex;align-items:center;gap:4px}
.q b{min-width:1.6em;text-align:center;font-size:1.15rem}
.q button{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:900;font-size:1.3rem;line-height:1;padding:0}
.sub{min-width:3.6em;text-align:right;font-weight:900;font-family:var(--dot);font-size:1.15rem}
.note{margin-top:12px;padding:10px 14px;border-radius:14px;font-weight:700}
.note[hidden]{display:none}
.note.bad{background:color-mix(in srgb,var(--bad) 13%,var(--paper));border:2px solid var(--bad)}
.note.ok{background:color-mix(in srgb,var(--good) 13%,var(--paper));border:2px solid var(--good)}
.note ul{margin:4px 0 0;padding-left:1.2em;list-style:disc}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);border-top:3px solid var(--line)}
.dock .btn{flex:none}

/* register + LCD */
.register{display:grid;gap:8px;background:var(--reg);border-radius:20px;border-bottom:8px solid var(--reg-d);padding:12px;box-shadow:var(--shadow)}
.lcd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:6px 14px;font-family:var(--dot);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.25)}
.lcd .l{font-size:1rem}
.lcd .v{font-weight:400;font-size:clamp(1.9rem,8vw,2.7rem);line-height:1.2;font-variant-numeric:tabular-nums}
.lcd.small{padding:4px 12px;flex-direction:column;align-items:flex-start;gap:0}
.lcd.small .l{font-size:.8rem}
.lcd.small .v{font-size:1.8rem}
.lcd-n{font-weight:400;font-size:1.8rem;line-height:1.2}

/* pay screens */
.paygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px;min-width:0}
.panel{background:var(--paper);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.instr{font-weight:900;font-size:1.1rem;margin-bottom:10px}
.mini-lines{display:grid;gap:4px;margin-top:2px;font-weight:700;font-size:.9rem}
.mini-lines li{display:flex;justify-content:space-between;gap:10px;background:var(--paper);color:var(--ink);padding:4px 10px;border-radius:8px}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:92px;padding:10px;border:3px dashed var(--line);border-radius:16px;background:var(--paper-2)}
.tray.static{border-style:solid;border-width:2px}
.mtray{padding:0;border:0;background:none;border-radius:50%;line-height:0}
.wallet{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.mbtn{display:grid;justify-items:center;align-content:center;gap:6px;min-height:104px;padding:8px 4px;border-radius:16px;border:3px solid var(--line);background:var(--paper);font-weight:900;font-size:.9rem;line-height:1.2}
.mbtn:active{translate:0 2px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:14px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;font-weight:900}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.choices .btn{font-family:var(--dot);font-size:1.6rem;font-weight:400}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.chain li{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 4px;border-radius:999px;background:var(--paper-2);font-family:var(--dot);font-size:1.15rem}
.chain li.start{padding-left:10px;font-family:var(--body);font-weight:900}

/* coins and bills (real sizes: 10円 23.5mm, 50円 21mm, 100円 22.6mm, 500円 26.5mm) */
.coin{--z:calc(var(--s) * var(--k,1));display:inline-grid;place-content:center;justify-items:center;width:var(--z);height:var(--z);border-radius:50%;
  font-weight:900;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 0 0 calc(var(--z) * .06) rgba(255,255,255,.4),inset 0 calc(var(--z) * -.08) calc(var(--z) * .12) rgba(0,0,0,.22);flex:none}
.coin b{font-size:calc(var(--z) * .36)}
.coin small{font-size:calc(var(--z) * .2);margin-top:calc(var(--z) * .02)}
.c10{--s:56px;background:radial-gradient(circle at 35% 28%,#F0B27D,var(--coin-cu) 55%,var(--coin-cu-d));color:#47210A}
.c100{--s:54px;background:radial-gradient(circle at 35% 28%,#fff,var(--coin-ag) 55%,var(--coin-ag-d));color:#29313A}
.c500{--s:64px;background:radial-gradient(circle at 35% 28%,#FFF6C4,var(--coin-au) 55%,var(--coin-au-d));color:#3F2F00}
.c50{--s:50px;background:radial-gradient(circle at 35% 28%,#fff,var(--coin-ag) 55%,var(--coin-ag-d));color:#29313A;padding-top:calc(var(--z) * .42);
  -webkit-mask:radial-gradient(circle,transparent 0 12%,#000 12.6%);mask:radial-gradient(circle,transparent 0 12%,#000 12.6%)}
.c50 b{font-size:calc(var(--z) * .3)}
.bill{--k:1;position:relative;display:inline-grid;place-items:center;flex:none;width:calc(118px * var(--k));height:calc(60px * var(--k));border-radius:5px;
  background:linear-gradient(100deg,var(--bill),#E3EDF8 55%,var(--bill));border:2px solid var(--bill-d);color:var(--bill-ink);font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bill .seal{position:absolute;left:calc(8px * var(--k));top:50%;translate:0 -50%;width:calc(30px * var(--k));height:calc(38px * var(--k));border-radius:50%;border:2px solid var(--bill-d);opacity:.7}
.bill b{font-size:calc(1.5rem * var(--k));margin-left:calc(26px * var(--k))}
.bill small{position:absolute;right:calc(8px * var(--k));bottom:calc(4px * var(--k));font-size:calc(.75rem * var(--k))}

/* result */
.result{display:grid;gap:16px;padding-bottom:16px}
.result .logo,.result .thanks{text-align:center}
.thanks{font-weight:900;font-size:1.15rem}
.stars{display:flex;justify-content:center;gap:6px}
.star{width:56px;height:56px;fill:var(--line)}
.star.on{fill:var(--pop);stroke:var(--pop-ink);stroke-width:1.3;stroke-linejoin:round}
.stars+.say2{text-align:center;font-weight:700;color:var(--ink-soft);margin-top:-8px}
.resgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.rl{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px;border-radius:14px;background:var(--paper-2)}
.rl .x{font-weight:900}
.result .actions{justify-content:center}

@media (max-width:760px){
  .pickhead,.paygrid,.resgrid{grid-template-columns:minmax(0,1fr)}
  .bunting i{width:28px;height:34px}
  .dock .btn{padding:0 18px}
}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:shake .35s}
  @keyframes shake{20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:4px 0}}
  .star.on{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pop{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
}
</style>

<div id="root" lang="ja">
  <header class="top" id="top"></header>
  <main id="app" tabindex="-1"></main>
</div>

<script>

function tone(f,t,d,type,g){

  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), gn=actx.createGain(), t0=actx.currentTime+t;

}

function makeOrder(level){
  var kinds = level===1 ? rnd(1,2) : level===2 ? rnd(2,3) : rnd(2,4);
  var ids = shuffle(ITEMS.map(function(x){ return x.id; })).slice(0,kinds);
  var o={};
  ids.forEach(function(id,i){
    var q=1;
    if(level===2 && i===0 && Math.random()<.4) q=2;
    if(level===3) q = Math.random()<.45 ? 2 : 1;
    o[id]=q;
  });
  return o;
}
function orderTotal(o){ return Object.keys(o).reduce(function(s,id){ return s+ITEMS[id].price*o[id]; },0); }

function pickPaid(level,total){
  if(level===1) return total;
  var up=function(u){ return Math.ceil((total+1)/u)*u; };
  var c=[up(100),500,1000];
  if(level===3) c=c.concat([up(50),up(100)+100,1500,2000]);
  c=c.filter(function(p,i){ return c.indexOf(p)===i && p>total && p-total<=1500 && p%10===0; });
  return c[rnd(0,c.length-1)];
}
function choicesFor(paid){
  var pool=shuffle([paid-100,paid+100,paid-500,paid+500,paid-50,paid+50].filter(function(x){ return x>0 && x!==paid; }));
  return shuffle([paid,pool[0],pool[1]]);
}
function diffCart(order,cart,kind){
  var where = kind==='buy' ? 'メモ' : 'ちゅうもん', out=[];
  Object.keys(order).forEach(function(id){
    var need=order[id], have=cart[id]||0;
    if(have<need) out.push(ITEMS[id].plain+' が あと '+(need-have)+'こ たりないよ');
    else if(have>need) out.push(ITEMS[id].plain+' が '+(have-need)+'こ おおいよ');
  });
  Object.keys(cart).forEach(function(id){ if(!(id in order)) out.push(ITEMS[id].plain+' は '+where+'に ないよ'); });
  return out;
}
var cartCount=function(){ return Object.keys(G.cart).reduce(function(s,k){ return s+G.cart[k]; },0); };
var cartTotal=function(){ return Object.keys(G.cart).reduce(function(s,k){ return s+ITEMS[k].price*G.cart[k]; },0); };
function cartIds(){ return Object.keys(G.cart).map(Number).sort(function(a,b){ return a-b; }); }

/* ---------- shared pieces ---------- */
function money(d,k){
  var st = k ? '--k:'+k : null;
  if(d===1000) return h('span',{class:'bill','aria-hidden':'true',style:st}, h('i',{class:'seal'}), h('b',null,'1000'), h('small',null,'円'));
  return h('span',{class:'coin c'+d,'aria-hidden':'true',style:st}, h('b',null,String(d)), d===50?null:h('small',null,'円'));
}
function register(rows){
  return h('section',{class:'register','aria-label':'レジ'}, rows.map(function(r){
    return h('div',{class:'lcd'}, h('span',{class:'l'},r[0]), h('b',{class:'v'},r[1]));
  }));
}
function bunting(){
  return h('div',{class:'bunting','aria-hidden':'true'}, ['f1','f2','f3','f4','f5','f1','f2','f3','f4','f5'].map(function(c,i){ return h('i',{class:c+(i%2?' dots':'')}); }));
}
function failNote(note,title,lines){
  note.className='note bad';
  note.replaceChildren.apply(note,[h('b',null,title)].concat(lines&&lines.length?[h('ul',null,lines.map(function(l){ return h('li',null,l); }))]:[]));
  note.hidden=false;
  note.classList.remove('shake'); void note.offsetWidth; note.classList.add('shake');
}
function walletBtns(onPick,label){
  return h('div',{class:'wallet'}, DEN.slice().reverse().map(function(d){
    return h('button',{type:'button',class:'mbtn','data-k':'w'+d,'aria-label':d+'えんを '+label,onclick:function(){ onPick(d); }},
      money(d), h('span',null, d===1000?'1000えんさつ':d+'えん'));
  }));
}
function coinTray(list,onRemove,emptyText){
  var sorted=list.slice().sort(function(a,b){ return b-a; });
  return h('div',{class:'tray',role:'group'}, sorted.length ? sorted.map(function(d,i){
    return h('button',{type:'button',class:'mtray','data-k':'t'+i,'aria-label':d+'えんを もどす',onclick:function(){ onRemove(d); }}, money(d));
  }) : [h('p',{class:'empty'},emptyText)]);
}
function removeOne(arr,d){ var i=arr.indexOf(d); if(i>=0) arr.splice(i,1); }

/* ---------- menu (built once, reused on every pick screen) ---------- */
var MENU = h('div',{class:'menu'}, ITEMS.map(function(it){
  return h('button',{type:'button',class:'card','data-id':it.id,'aria-label':it.plain+' '+it.price+'えん'},
    h('span',{class:'tag'},'¥'+it.price),
    h('span',{class:'ph'}, h('img',{src:it.img,alt:'',width:200,height:150})),
    h('span',{class:'nm'}, h('span',{html:it.html}), it.note?h('small',null,it.note):null),
    h('span',{class:'badge',hidden:true})
  );
}));
MENU.onPick=null;
MENU.addEventListener('click',function(e){
  var b=e.target.closest('.card');
  if(b && MENU.onPick) MENU.onPick(+b.getAttribute('data-id'));
});
function updateBadges(){
  Array.prototype.forEach.call(MENU.querySelectorAll('.card'),function(c){
    var id=c.getAttribute('data-id'), q=(G&&G.cart&&G.cart[id])||0, b=c.querySelector('.badge'), it=ITEMS[id];
    b.hidden=!q; b.textContent=q?String(q):''; c.classList.toggle('on',q>0);
    c.setAttribute('aria-label',it.plain+' '+it.price+'えん'+(q?' いま '+q+'こ':''));
  });
}

/* ---------- navigation ---------- */
var app=$('#app'), topEl=$('#top');
function mount(node,dock){
  app.replaceChildren(node);
  app.classList.toggle('has-dock',!!dock);
  window.scrollTo(0,0);
}
function crumb(){
  if(S.screen==='home'||!G) return '';
  return MODE_NAME[G.mode];
}
function renderTop(){
  topEl.replaceChildren(
    S.screen!=='home'
      ? h('button',{type:'button',class:'iconbtn',onclick:function(){ sfx.back(); go('home'); }}, svg(ICON.home), h('span',null,'ホーム'))
      : h('span',{class:'brand'},'みのるパン'),
    h('span',{class:'crumb'},crumb()),
    h('span',{class:'pill',role:'status','aria-label':'ほし '+S.stars+'こ'}, svg(ICON.star), h('b',null,String(S.stars))),
    h('button',{type:'button',class:'iconbtn sq','aria-label':'おと','aria-pressed':String(S.sound),onclick:function(){
      S.sound=!S.sound; store.set('sound',S.sound); sfx.tap(); renderTop();
    }}, svg(S.sound?ICON.sndOn:ICON.sndOff))
  );
}
function go(name){
  S.screen=name;
  if(name==='home'){ G=null; MENU.onPick=null; }
  renderTop();
  SCREENS[name]();
}
function start(mode){
  G={mode:mode,level:S.level,order:mode==='free'?null:makeOrder(S.level),cart:{},coins:[],gave:[],mistakes:0,hint:false,done:false,starsEarned:null};
  go(mode==='cash'?'cashPick':'shop');
}

/* ---------- screens ---------- */
function screenHome(){
  function mode(m,title,text,vis){
    return h('button',{type:'button',class:'mode',onclick:function(){ sfx.tap(); start(m); }},
      h('span',{class:'vis'},vis), h('span',{class:'mt'},title), h('span',{class:'md'},text));
  }
  var resetBtn=h('button',{type:'button',onclick:function(){
    if(resetBtn.getAttribute('data-ask')){ S.stars=0; store.set('stars',0); renderTop(); resetBtn.removeAttribute('data-ask'); resetBtn.textContent='ほしを ぜんぶ けす'; }
    else{ resetBtn.setAttribute('data-ask','1'); resetBtn.textContent='ほんとうに けす? もういちど おす'; }
  }},'ほしを ぜんぶ けす');
  mount(h('div',{class:'home'},
    bunting(),
    h('h1',{class:'logo'},'みのるパン',h('br'),'レジれんしゅう'),
    h('p',{class:'lead'},'みのるパンの メニューで、おかいものの れんしゅうを しよう。'),
    h('section',null, h('h2',{class:'sec'},'なにを する?'), h('div',{class:'modes'},
      mode('buy','おきゃくさんに なる','かいものメモの とおりに パンを えらんで、ちょうどの おかねを はらおう。',[h('img',{src:ITEMS[3].img,alt:''}),h('img',{src:ITEMS[7].img,alt:''})]),
      mode('free','じゆうに かう','すきな パンを えらんで、すきな おかねで はらおう。',[h('img',{src:ITEMS[34].img,alt:''}),h('img',{src:ITEMS[35].img,alt:''})])
    )),
    h('div',{class:'foot'},
      h('p',null,'せんせいへ: メニューの ねだんは ひょうじの とおりです。おかねは 10円・50円・100円・500円玉と 1000円札を つかいます。ほしの きろくは この たんまつの ブラウザに のこります。'),
      resetBtn)
  ));
}

function memoEl(order){
  return h('section',{class:'memo','aria-label':'かいものメモ'}, h('h2',null,'かいものメモ'),
    h('ul',null,Object.keys(order).map(function(id){
      return h('li',null,thumb(ITEMS[id]),nameEl(ITEMS[id]),h('span',{class:'x'},order[id]+'こ'));
    })));
}
function bubbleEl(order){
  return h('section',{class:'bubble','aria-label':'おきゃくさんの ちゅうもん'}, h('h2',null,'おきゃくさんの ちゅうもん'),
    h('p',{class:'say'},'「'+orderText(order)+'」'),
    h('ul',{class:'chips'},Object.keys(order).map(function(id){
      return h('li',null,thumb(ITEMS[id]),h('span',null,order[id]+'こ'));
    })));
}

function screenPick(){
  var kind=G.mode;
  var trayBox=h('section',{class:'tray-panel','aria-label':kind==='cash'?'レジ':'トレイ'});
  var note=h('div',{class:'note',hidden:true,role:'alert'});
  var totalEl=h('b',{class:'v'});
  var goBtn=h('button',{type:'button',class:'btn primary',onclick:submit}, kind==='cash'?'ごうけい':'おかいけいへ');
  var dock=h('div',{class:'dock'}, h('div',{class:'lcd small'},h('span',{class:'l'},'ごうけい'),totalEl), goBtn);

  function add(id){
    if((G.cart[id]||0)>=9) return;
    G.cart[id]=(G.cart[id]||0)+1; sfx.tap(); note.hidden=true; renderTray();
  }
  function dec(id){
    if(!G.cart[id]) return;
    G.cart[id]--; if(!G.cart[id]) delete G.cart[id];
    sfx.back(); note.hidden=true; renderTray();
  }
  function line(id){
    var it=ITEMS[id], q=G.cart[id];
    return h('li',{class:'line'}, thumb(it), nameEl(it),
      h('span',{class:'q'},
        h('button',{type:'button','data-k':'m'+id,'aria-label':it.plain+'を へらす',onclick:function(){ dec(id); }},'−'),
        h('b',null,String(q)),
        h('button',{type:'button','data-k':'p'+id,'aria-label':it.plain+'を ふやす',onclick:function(){ add(id); }},'+')),
      h('span',{class:'sub'},'¥'+it.price*q));
  }
  function renderTray(){
    keepFocus(trayBox,function(){
      var ids=cartIds();
      trayBox.replaceChildren(
        h('h2',{class:'sec'}, kind==='cash'?'レジに いれた パン':'トレイの パン'),
        ids.length ? h('ul',{class:'lines'},ids.map(line)) : h('p',{class:'empty'}, kind==='cash'?'パンを タップして レジに いれよう':'パンを タップして トレイに いれよう'),
        note);
    });
    totalEl.textContent='¥'+cartTotal();
    goBtn.disabled=cartCount()===0;
    updateBadges();
  }
  function submit(){
    if(kind==='free'){ G.total=cartTotal(); sfx.coin(); go('pay'); return; }
    var probs=diffCart(G.order,G.cart,kind);
    if(probs.length){
      G.mistakes++; sfx.no();
      failNote(note, kind==='buy'?'メモと ちがうよ':'ちゅうもんと ちがうよ', probs.slice(0,3));
      return;
    }
    G.total=cartTotal(); sfx.coin();
    if(kind==='buy'){ go('pay'); return; }
    G.paid=pickPaid(G.level,G.total); G.change=G.paid-G.total; G.gave=[]; G.paidKnown=G.level!==3;
    if(G.level===3) G.choices=choicesFor(G.paid);
    go('cashPay');
  }

  MENU.onPick=add;
  var head = kind==='buy' ? memoEl(G.order) : kind==='cash' ? bubbleEl(G.order) : null;
  mount(h('div',{class:'pick'},
    h('div',{class:'pickhead'+(head?'':' one')}, head, trayBox),
    h('section',null, h('h2',{class:'sec'},'メニュー'), MENU),
    dock
  ),true);
  renderTray();
}

function screenPay(){
  var level=G.level, showSum=level!==3, exact=G.mode==='buy'&&level===1;
  var box=h('div',{class:'pay'});
  function instr(){
    if(G.mode==='free') return 'すきな おかねで はらおう。';
    if(exact) return 'ちょうどの おかねを だして はらおう。';
    if(level===2) return 'おかねを だして はらおう。おおく だすと、おつりが もらえるよ。';
    return 'いくら だしたか かぞえながら はらおう。';
  }
  function fail(note,msg){ G.mistakes++; sfx.no(); failNote(note,msg); }
  function draw(){
    keepFocus(box,function(){
      var paid=sum(G.coins), note=h('div',{class:'note',hidden:true,role:'alert'});
      var payBtn=h('button',{type:'button',class:'btn primary',disabled:!G.coins.length,onclick:function(){
        var total=G.total, p=sum(G.coins);
        if(p<total){ fail(note, showSum ? 'あと '+(total-p)+'えん たりないよ' : 'まだ たりないよ。おかねを かぞえなおそう'); return; }
        if(exact && p>total){ fail(note,'ぴったりに しよう。'+(p-total)+'えん おおいよ'); return; }
        G.paid=p; G.change=p-total; sfx.ok(); go('result');
      }},'はらう');
      box.replaceChildren(h('div',{class:'paygrid'},
        h('div',{class:'stack'},
          register([['ごうけい','¥'+G.total],['だした おかね',showSum?'¥'+paid:'¥ ?']]),
          h('section',{class:'panel'}, h('h2',{class:'sec'},'かった パン'),
            h('ul',{class:'mini-lines'},cartIds().map(function(id){
              return h('li',null,h('span',{html:ITEMS[id].html+(ITEMS[id].note?ITEMS[id].note:'')}),h('span',null,G.cart[id]+'こ  ¥'+ITEMS[id].price*G.cart[id]));
            })))
        ),
        h('div',{class:'stack'},
          h('section',{class:'panel'},
            h('p',{class:'instr'},instr()),
            h('h2',{class:'sec'},'はらう おかね'),
            coinTray(G.coins,function(d){ removeOne(G.coins,d); sfx.back(); draw(); },'おさいふの おかねを タップして、ここに だそう'),
            note),
          h('section',{class:'panel'}, h('h2',{class:'sec'},'おさいふ'),
            walletBtns(function(d){ G.coins.push(d); sfx.coin(); draw(); },'だす'),
            h('div',{class:'actions'},
              h('button',{type:'button',class:'btn',disabled:!G.coins.length,onclick:function(){ G.coins=[]; sfx.back(); draw(); }},'やりなおし'),
              payBtn))
        )
      ));
    });
  }
  draw();
  mount(box);
}

function screenCashPay(){
  var level=G.level, showSum=level!==3;
  var box=h('div',{class:'cashpay'});
  function fail(note,msg){ G.mistakes++; sfx.no(); failNote(note,msg); }
  function draw(){
    keepFocus(box,function(){
      var total=G.total, paid=G.paid, known=G.paidKnown, gave=sum(G.gave);
      var note=h('div',{class:'note',hidden:true,role:'alert'});
      var left=[
        register([['ごうけい','¥'+total],['おあずかり',known?'¥'+paid:'¥ ?'],['おつり',G.done?'¥'+G.change:(level===1?'¥0':'¥ ?')]]),
        h('section',{class:'panel'}, h('h2',{class:'sec'},'おきゃくさんの おかね'),
          h('div',{class:'tray static'},greedy(paid).map(function(d){ return money(d); })))
      ];
      var right=[];
      if(level===1){
        right.push(h('section',{class:'panel'},
          h('p',{class:'instr'},'ぴったり ちょうど あるよ。おつりは いらないね。'),
          h('div',{class:'actions'},h('button',{type:'button',class:'btn primary',onclick:function(){ G.done=true; G.gave=[]; sfx.ok(); go('result'); }},'うけとる'))));
      }else if(!known){
        right.push(h('section',{class:'panel'},
          h('p',{class:'instr'},'おきゃくさんの おかねを かぞえよう。おあずかりは いくら?'),
          h('div',{class:'choices'},G.choices.map(function(c){
            return h('button',{type:'button',class:'btn',onclick:function(){
              if(c===paid){ G.paidKnown=true; sfx.coin(); draw(); }
              else fail(note,'もういちど かぞえて みよう');
            }},'¥'+c);
          })),
          note));
      }else{
        var chain=null;
        if(G.hint){
          var cur=total;
          chain=h('ul',{class:'chain','aria-label':'かぞえあげ'},
            [h('li',{class:'start'},'ごうけい '+total)].concat(G.gave.length||true ? greedy(G.change).slice().sort(function(a,b){ return a-b; }).map(function(d){
              cur+=d; return h('li',null,money(d,.5),String(cur));
            }) : []));
        }
        right.push(
          h('section',{class:'panel'},
            h('p',{class:'instr'},'おつりを わたそう。ごうけい から おあずかり まで、かぞえあげて みよう。'),
            h('h2',{class:'sec'},'わたす おつり'),
            coinTray(G.gave,function(d){ removeOne(G.gave,d); sfx.back(); draw(); },'レジの おかねを タップして、おつりを だそう'),
            showSum ? h('div',{class:'sumrow'},h('span',null,'わたす おかね'),h('span',{class:'lcd-n'},'¥'+gave)) : null,
            G.hint ? h('div',null,h('p',{class:'say'},'かぞえあげの ヒント'),chain) : null,
            note),
          h('section',{class:'panel'}, h('h2',{class:'sec'},'レジの おかね'),
            walletBtns(function(d){ G.gave.push(d); sfx.coin(); draw(); },'わたす'),
            h('div',{class:'actions'},
              h('button',{type:'button',class:'btn',disabled:G.hint,onclick:function(){ G.hint=true; sfx.tap(); draw(); }},'ヒント'),
              h('button',{type:'button',class:'btn',disabled:!G.gave.length,onclick:function(){ G.gave=[]; sfx.back(); draw(); }},'やりなおし'),
              h('button',{type:'button',class:'btn primary',disabled:!G.gave.length,onclick:function(){
                var need=G.change;
                if(gave===need){ G.done=true; sfx.ok(); go('result'); }
                else if(gave<need) fail(note, showSum ? 'あと '+(need-gave)+'えん たりないよ' : 'すくないよ。もういちど かぞえよう');
                else fail(note, showSum ? (gave-need)+'えん おおいよ' : 'おおいよ。もういちど かぞえよう');
              }},'わたす')))
        );
      }
      box.replaceChildren(h('div',{class:'paygrid'},h('div',{class:'stack'},left),h('div',{class:'stack'},right)));
    });
  }
  draw();
  mount(box);
}

function starsEl(n){
  return h('div',{class:'stars',role:'img','aria-label':'ほし '+n+'こ'},[1,2,3].map(function(i){
    var s=svg(ICON.star); s.classList.add('star'); if(i<=n) s.classList.add('on'); s.style.animationDelay=(i*.16)+'s'; return s;
  }));
}
function screenResult(){
  var free=G.mode==='free', cash=G.mode==='cash';
  if(!free && G.starsEarned==null){
    var s=3-(G.mistakes>=3?2:G.mistakes>=1?1:0)-(G.hint?1:0);
    G.starsEarned=Math.max(1,s); S.stars+=G.starsEarned; store.set('stars',S.stars); renderTop();
  }
  var total=G.total, paid=cash?G.paid:G.paid, change=G.change;
  if(cash && G.level===1){ paid=total; change=0; }
  var say2={3:'ぜんぶ よくできました!',2:'よくできました!',1:'さいごまで できたね。また やってみよう。'};
  var changeCoins = cash ? G.gave.slice().sort(function(a,b){ return b-a; }) : greedy(change);
  var lines=cartIds().map(function(id){
    return h('li',{class:'rl'},thumb(ITEMS[id]),nameEl(ITEMS[id]),h('span',{class:'x'},G.cart[id]+'こ'),h('span',{class:'sub'},'¥'+ITEMS[id].price*G.cart[id]));
  });
  mount(h('div',{class:'result'},
    h('h1',{class:'logo sm'}, cash?'おつりを わたせたよ!':'かえたよ!'),
    free?null:starsEl(G.starsEarned),
    free?null:h('p',{class:'say2'},say2[G.starsEarned]),
    h('p',{class:'thanks'}, cash?'おきゃくさん「ありがとう!」':'てんいんさん「ありがとうございました!」'),
    h('div',{class:'resgrid'},
      h('section',{class:'panel'},h('h2',{class:'sec'},'かった パン'),h('ul',{class:'lines'},lines)),
      h('div',{class:'stack'},
        register([['ごうけい','¥'+total],['おあずかり','¥'+paid],['おつり','¥'+change]]),
        h('section',{class:'panel'},h('h2',{class:'sec'}, cash?'わたした おつり':'もらった おつり'),
          change>0 ? h('div',{class:'tray static'},changeCoins.map(function(d){ return money(d); })) : h('p',{class:'empty'},'ぴったり だったから、おつりは ないよ。'))
      )),
    h('div',{class:'actions'},
      h('button',{type:'button',class:'btn primary',onclick:function(){ sfx.tap(); start(G.mode); }},'もういちど'),
      h('button',{type:'button',class:'btn',onclick:function(){ sfx.back(); go('home'); }},'ホームへ'))
  ));
}

var SCREENS={home:screenHome,shop:screenPick,cashPick:screenPick,pay:screenPay,cashPay:screenCashPay,result:screenResult};
go('home');
})();
</script>
